# ─────────────────────────────────────────────────────────────────────────────
# Nginx — ChatApp
# Domaine : artem-www.wywiwyg.net
# Node.js  : localhost:3000
# ─────────────────────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name artem-www.wywiwyg.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS + Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name artem-www.wywiwyg.net;

    # ── SSL (Let's Encrypt / Certbot) ──────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/artem-www.wywiwyg.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artem-www.wywiwyg.net/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/artem-www.wywiwyg.net/chain.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security Headers ───────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header X-XSS-Protection         "1; mode=block"                                always;

    # ── Logging ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/chatapp.access.log;
    error_log  /var/log/nginx/chatapp.error.log warn;

    # ── Static files (served directly by Nginx) ───────────────────────────
    location /public/ {
        alias /var/www/chatapp/public/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /uploads/ {
        alias /var/www/chatapp/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        # Sécurité : bloquer l'exécution de fichiers
        location ~* \.(php|py|sh|cgi)$ { deny all; }
        access_log off;
    }

    # ── Socket.io WebSocket ───────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  86400s;  # WebSocket longue durée
        proxy_send_timeout  86400s;
        proxy_connect_timeout 60s;
    }

    # ── Application Node.js (toutes les autres routes) ────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;

        # Limite upload (images 5 Mo + overhead)
        client_max_body_size 6m;

        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      4 32k;
    }

    # ── Bloquer les fichiers sensibles ─────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
